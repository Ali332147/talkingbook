<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Family Talking Book</title><link rel="stylesheet" href="style.css"></head><body><div class="app">
<header><div class="heart">❤️</div><h1>Our Family, Our Love</h1><p>Jaber • Sharmin • Soha • Safa • Hasan</p>
<select id="language"><option value="bn">🇧🇩 Bangla</option><option value="en">🇺🇸 English</option><option value="es">🇪🇸 Spanish</option></select></header>
<section class="book"><div class="art photo-art" id="familyScene" role="img" aria-label="Animated Jaber family">
  <img class="family-photo" src="family-scene.png" alt="Jaber, Sharmin, Hasan, Soha and Safa family cartoon">
  <div class="photo-character dad" data-character="dad"><div class="photo-mouth"></div></div>
  <div class="photo-character mom" data-character="mom"><div class="photo-mouth"></div></div>
  <div class="photo-character hasan" data-character="hasan"><div class="photo-mouth"></div></div>
  <div class="photo-character soha" data-character="soha"><div class="photo-mouth"></div></div>
  <div class="photo-character safa" data-character="safa"><div class="photo-mouth"></div></div>
</div><div class="story"><small id="label"></small><h2 id="title"></h2><p id="text"></p></div></section>
<div id="status">❤️ Ready</div><div class="controls"><button id="prev">← Previous</button><button id="listen">🔊 Listen This Story</button><button id="full">🎧 Listen All 10 Stories</button><button id="stop">⏹ Stop</button><button id="next">Next →</button></div>
<div class="progress"><i id="bar"></i></div><div id="count"></div></div><script src="script.js"></script></body></html>
